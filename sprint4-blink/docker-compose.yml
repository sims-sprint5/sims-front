services:
  frontend-dev:
    build:
      context: .
      target: dev
    container_name: sprint4-blink-dev
    ports:
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_DEV_PROXY_TARGET=http://host.docker.internal:8000
    command: npm run dev -- --host 0.0.0.0 --port 5173

  frontend-prod:
    build:
      context: .
      target: production
      args:
        VITE_CENTRAL_API_URL: ${VITE_CENTRAL_API_URL}
        VITE_TENANT_BASE_URL: ${VITE_TENANT_BASE_URL}
        VITE_TENANT_DOMAIN_SUFFIX: ${VITE_TENANT_DOMAIN_SUFFIX}
        VITE_API_PORT: ${VITE_API_PORT}
        VITE_APP_BASE_DOMAIN: ${VITE_APP_BASE_DOMAIN}
        VITE_CENTRAL_BLADE_URL: ${VITE_CENTRAL_BLADE_URL}
    container_name: sprint4-blink-prod
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
