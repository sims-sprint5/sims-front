name: Deploy Frontend Main to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SSH_PORT: ${{ secrets.DEPLOY_PORT }}
  HEALTHCHECK_URL: https://simsgrup2.app/login
  FRONTEND_DIR: sprint4-blink
  REMOTE_DIR: /opt/sims-front-2/sprint4-blink

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test and Validate Docker Build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sprint4-blink/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run test

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Validate Docker production image build
        run: docker build --target production -t sims-front:ci "${FRONTEND_DIR}"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    name: Deploy to DigitalOcean
    timeout-minutes: 20
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Embed build metadata
        run: |
          mkdir -p "${FRONTEND_DIR}/public"
          printf 'commit=%s\nbuild_date=%s\n' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${FRONTEND_DIR}/public/build.txt"

      - name: Setup SSH key
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload frontend source to droplet
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p "${SSH_PORT}" "$SSH_USER@$SSH_HOST" "mkdir -p '${REMOTE_DIR}'"

          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p ${SSH_PORT}" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            "${FRONTEND_DIR}/" \
            "$SSH_USER@$SSH_HOST:${REMOTE_DIR}/"

      - name: Build and run frontend Docker container
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p "${SSH_PORT}" "$SSH_USER@$SSH_HOST" "REMOTE_DIR='${REMOTE_DIR}' bash -s" << 'EOF'
            set -e
            cd "${REMOTE_DIR}"

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD='docker compose'
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD='docker-compose'
            else
              echo 'Neither docker compose plugin nor docker-compose is installed on server.'
              exit 1
            fi

            docker rm -f sprint4-blink-prod >/dev/null 2>&1 || true
            sh -c "$COMPOSE_CMD down --remove-orphans" || true
            docker network create sprint4-blink_default >/dev/null 2>&1 || true
            sh -c "$COMPOSE_CMD up -d --build --force-recreate --remove-orphans frontend-prod"
            docker ps --filter "name=sprint4-blink-prod"

            docker image prune -f
          EOF

      - name: Verify deployed commit on container
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p "${SSH_PORT}" "$SSH_USER@$SSH_HOST" "curl -fSsL 'http://localhost:8080/build.txt?v=${GITHUB_SHA}'" > build_meta.txt
          echo "Build metadata from container:"
          cat build_meta.txt
          grep -q "commit=${GITHUB_SHA}" build_meta.txt

      - name: Healthcheck frontend
        run: |
          curl -fSsL "${HEALTHCHECK_URL}?v=${GITHUB_SHA}" > /dev/null
          echo "Frontend deployed and reachable: ${HEALTHCHECK_URL}"