name: Deploy Frontend Main to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SSH_PORT: 22
  HEALTHCHECK_URL: https://simsgrup2.app/login
  FRONTEND_DIR: sprint4-blink

jobs:
  # ---------------------------------------------
  # TEST JOB
  # - Instala dependencias
  # - Ejecuta tests obligatorios (si fallan, se detiene el pipeline)
  # - Compila frontend una sola vez
  # - Publica dist como artifact para deploy
  # ---------------------------------------------
  test:
    runs-on: ubuntu-latest
    name: Test and Build Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sprint4-blink/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run test

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Embed build metadata
        run: |
          printf 'commit=%s\nbuild_date=%s\n' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${FRONTEND_DIR}/dist/build.txt"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          # Se conserva la carpeta dist generada por el build
          path: ${{ env.FRONTEND_DIR }}/dist
          if-no-files-found: error

  # ---------------------------------------------
  # DEPLOY JOB
  # - Depende de test: si test/build falla, no despliega
  # - Descarga artifact dist en la raíz del runner (./dist)
  # - Publica archivos en servidor por rsync
  # - Publica de forma más segura usando carpeta temporal + swap
  # - Recarga Nginx (sin reconfigurarlo)
  # - Ejecuta healthcheck final
  # ---------------------------------------------
  deploy:
    needs: test
    runs-on: ubuntu-latest
    name: Deploy to DigitalOcean
    timeout-minutes: 20
    if: success()

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          # Ruta simplificada: dist/ en la raíz del job
          path: dist

      - name: Setup SSH key
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config << EOF
          Host deploy
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            Port ${SSH_PORT}
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload dist to droplet
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Enviamos directamente ./dist descargado del artifact
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p ${SSH_PORT}" \
            "dist/" \
            "$SSH_USER@$SSH_HOST:/tmp/sims-front-dist/"

      - name: Publish on Nginx and reload
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p "${SSH_PORT}" "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e

            # Despliegue seguro: preparamos release en carpeta temporal
            # y luego hacemos swap para evitar dejar html vacío ante fallos.
            RELEASE_DIR="/tmp/sims-front-release-$(date +%s)"
            mkdir -p "$RELEASE_DIR"
            cp -r /tmp/sims-front-dist/. "$RELEASE_DIR/"

            # Ajustar permisos antes del swap
            chown -R www-data:www-data "$RELEASE_DIR"
            chmod -R 755 "$RELEASE_DIR"

            # Backup rápido del release actual y swap atómico por rename
            rm -rf /usr/share/nginx/html.prev
            if [ -d /usr/share/nginx/html ]; then
              mv /usr/share/nginx/html /usr/share/nginx/html.prev
            fi
            mv "$RELEASE_DIR" /usr/share/nginx/html

            rm -rf /tmp/sims-front-dist
            rm -rf /usr/share/nginx/html.prev
            systemctl reload nginx
          EOF

      - name: Healthcheck frontend
        run: |
          curl -fSsL "${HEALTHCHECK_URL}?v=${GITHUB_SHA}" > /dev/null
          echo "Build metadata from server:"
          curl -fSsL "https://simsgrup2.app/build.txt?v=${GITHUB_SHA}" | cat
          echo "Frontend deployed and reachable: ${HEALTHCHECK_URL}"
